name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version du moteur est une donnée du dépôt, pas une constante du workflow :
      # changer de moteur ne doit pas demander de toucher à la CI.
      - id: engine
        run: echo "ref=$(cat .engine-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: slashome/me
          ref: ${{ steps.engine.outputs.ref }}
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npx -y tsx@4 check.ts
